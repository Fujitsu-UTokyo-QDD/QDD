name: Test library on pull request

on: pull_request

jobs:
  python_test:
    name: Python test (${{ matrix.os }} ${{ matrix.arch }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
        exclude:
          - os: ubuntu-24.04-arm
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Install package and test dependencies
        run: python -m pip install '.[test]'

      - name: Run pytest
        run: |
          rm -rf /tmp/qdd-tests
          mkdir -p /tmp/qdd-tests
          cp pyproject.toml /tmp/qdd-tests/pyproject.toml
          cp -r test /tmp/qdd-tests/test
          cd /tmp/qdd-tests
          python -m pytest -m "not slow and not mpi"

  cpp_test:
    name: C++ test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBINDINGS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  windows_python_test:
    name: Python test (windows-latest x86_64 / py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build ninja

      - name: Install package and test dependencies
        env:
          CMAKE_ARGS: >-
            -G Ninja
            -DCMAKE_C_COMPILER=clang-cl
            -DCMAKE_CXX_COMPILER=clang-cl
        run: python -m pip install ".[test]"

      - name: Run pytest
        run: python -m pytest test/python -m "not slow and not mpi"

  windows_cpp_test:
    name: C++ test (windows-latest x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM
        run: |
          choco install llvm --version=18.1.8 -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install Ninja
        run: pip install ninja

      - name: Configure with clang-cl
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DBINDINGS=OFF
        shell: pwsh

      - name: Build
        run: cmake --build build -j

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure -C Release
