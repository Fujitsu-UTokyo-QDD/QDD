name: Test library on pull request

on: pull_request

jobs:
  python_test:
    name: Python test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Install package and test dependencies
        run: python -m pip install .[test]

      - name: Run pytest
        run: |
          rm -rf /tmp/qdd-tests
          mkdir -p /tmp/qdd-tests
          cp pyproject.toml /tmp/qdd-tests/pyproject.toml
          cp -r test /tmp/qdd-tests/test
          cd /tmp/qdd-tests
          python -m pytest -m "not slow and not mpi"

  cpp_test:
    name: C++ test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBINDINGS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
