name: Build and publish documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install Python package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'

      - name: Generate C++ XML
        run: |
          mkdir -p docs/build/doxygen
          doxygen docs/Doxyfile

      - name: Build HTML
        run: sphinx-build -b html docs/source docs/build/html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/build/html

  required_check:
    # Keep this check name stable for branch protection.
    name: QDD documentation passed
    if: ${{ always() }}
    # Deployment is intentionally skipped on pull requests.
    needs: [build]
    runs-on: ubuntu-26.04
    steps:
      - name: Require the documentation build to succeed
        shell: bash
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $JOB_RESULTS"
          test -n "$JOB_RESULTS"
          for result in $JOB_RESULTS; do
            test "$result" = success || exit 1
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
