name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.arch }} / cp${{ matrix.python-tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-tag: ["39", "310", "311", "312", "313", "314"]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: cp${{ matrix.python-tag }}-manylinux_${{ matrix.arch }}
          CIBW_TEST_SKIP: cp314-manylinux_aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}-cp${{ matrix.python-tag }}
          path: ./wheelhouse/*.whl

  build_wheels_windows:
    name: Build wheels (windows-latest x86_64 / cp${{ matrix.python-tag }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-tag: ["39", "310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp${{ matrix.python-tag }}-win_amd64
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-win_amd64-cp${{ matrix.python-tag }}
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: Build wheels (${{ matrix.os }} ${{ matrix.arch }} / cp${{ matrix.python-tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
        python-tag: ["39", "310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BUILD: cp${{ matrix.python-tag }}-macosx_${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macosx_${{ matrix.arch }}-cp${{ matrix.python-tag }}
          path: ./wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    needs: [build_wheels, build_wheels_windows, build_wheels_macos, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qdd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist/
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          path: dist/
          name: sdist
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
