[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
    "setuptools-scm",
]
build-backend = "scikit_build_core.build"

[project]
name = "qdd"
dynamic = ["version"]
description = "Qiskit Provider for QDD"
authors = [{name = "Yusuke Kimura", email = "yusuke-kimura@fujitsu.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
    "qiskit~=2.2.0",
]

[project.urls]
Homepage = "https://github.com/Fujitsu-UTokyo-QDD/QDD"
Documentation = "https://fujitsu-utokyo-qdd.github.io/QDD/"
Repository = "https://github.com/Fujitsu-UTokyo-QDD/QDD"
Issues = "https://github.com/Fujitsu-UTokyo-QDD/QDD/issues"

# Optional dependency groups for local development and documentation builds.
[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
    "qiskit-aer>=0.13.3",
]
docs = [
    "sphinx>=7.4",
    "myst-parser>=4.0",
    "breathe>=4.35",
    "sphinx-rtd-theme>=2.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["qdd"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "qdd/_version.py"
fallback_version = "0.2.7"

[tool.cibuildwheel]
skip = ["*-musllinux_*", "*_i686", "pp*"]
build-frontend = "build"
test-extras = "test"
test-command = 'pytest test/python -m "not slow and not mpi"'
test-sources = ["test", "pyproject.toml"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.pytest.ini_options]
testpaths = [
    "test/python",
]
markers = [
    "slow: marks tests as taking a long time to run",
    "mpi: tests for MPI",
    "no_mpi_support: tests that do not support MPI execution",
]
addopts = "-m \"not slow and not mpi\" --strict-markers"
